
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comicvision-ai"
version = "0.1.0"
description = "AI-powered comic book cataloging, recommendation, and multimodal search"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
